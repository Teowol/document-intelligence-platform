{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Log in" %} · DIP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3 text-center">📄 {% trans "Document Intelligence Platform" %}</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="form-check small mb-3" data-password-visibility hidden>
            <input type="checkbox" class="form-check-input" id="show-login-password">
            <label class="form-check-label" for="show-login-password">{% trans "Show my password" %}</label>
          </div>
          <button type="submit" class="btn w-100" style="background: var(--accent); color: var(--accent-ink);">{% trans "Log in" %}</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          {% trans "No account yet?" %} <a href="{% url 'account_signup' %}" style="color: var(--accent-contrast);">{% trans "Sign up" %}</a>
        </p>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
