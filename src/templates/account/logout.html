{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Log out" %} · DIP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 text-center">
    <div class="card">
      <div class="card-body">
        <h1 class="h3 mb-3">{% trans "Log out" %}</h1>
        <p>{% trans "Are you sure you want to log out?" %}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn" style="background: var(--danger); color: #fff;">⎋ {% trans "Log out" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
