# nginx reverse proxy for the document intelligence platform (Phase 10).
#
# TLS via Let's Encrypt lives under /etc/letsencrypt/live/<host>/ and is
# mounted from ./deploy/tls-certs. Without certs it plainly won't start on
# 443; for local HTTP-only testing remove the server443 block or set
# NGINX_SSL=false in compose (see the full example below).

events {}

http {
  sendfile on;
  client_max_body_size 26m;

  # HTTP -> HTTPS redirect (production)
  server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dip/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
      alias /static/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
      # Originals are served by Django's permission-checked document endpoint.
      return 404;
    }

    location / {
      proxy_pass http://web:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
